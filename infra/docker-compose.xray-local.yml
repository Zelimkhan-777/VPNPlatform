name: vpn-platform-xray-local

services:
  xray-tls-init:
    image: alpine:3.21
    volumes:
      - xray-tls:/tls
    command:
      - /bin/sh
      - -c
      - |
        set -e
        if [ ! -f /tls/cert.pem ] || [ ! -f /tls/key.pem ]; then
          apk add --no-cache openssl
          openssl req -x509 -newkey rsa:2048 -sha256 -days 365 -nodes \
            -keyout /tls/key.pem -out /tls/cert.pem \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
        fi
        # Official Xray image runs as UID 65532. chmod 600 (root-only) made
        # cert.pem unreadable and the containers restart-looped. 644 is for
        # this localhost self-signed volume only, not production secret handling.
        chmod 644 /tls/cert.pem /tls/key.pem

  xray-a:
    image: ghcr.io/xtls/xray-core:25.6.8
    depends_on:
      xray-tls-init:
        condition: service_completed_successfully
    restart: unless-stopped
    ports:
      - '127.0.0.1:${XRAY_LOCAL_A_PORT:-10443}:443'
    volumes:
      - ../var/xray-local/a/config.json:/etc/xray/config.json:ro
      - xray-tls:/etc/xray/tls:ro
    command: ['run', '-c', '/etc/xray/config.json']

  xray-b:
    image: ghcr.io/xtls/xray-core:25.6.8
    depends_on:
      xray-tls-init:
        condition: service_completed_successfully
    restart: unless-stopped
    ports:
      - '127.0.0.1:${XRAY_LOCAL_B_PORT:-10444}:443'
    volumes:
      - ../var/xray-local/b/config.json:/etc/xray/config.json:ro
      - xray-tls:/etc/xray/tls:ro
    command: ['run', '-c', '/etc/xray/config.json']

volumes:
  xray-tls:
