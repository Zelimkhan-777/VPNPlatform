name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://vpn_platform:vpn_platform_ci@127.0.0.1:5432/vpn_platform?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      NODE_ENV: test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vpn_platform
          POSTGRES_USER: vpn_platform
          POSTGRES_PASSWORD: vpn_platform_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vpn_platform -d vpn_platform"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm prisma:validate

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Apply Prisma migrations
        run: pnpm prisma:migrate:deploy

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Integration test
        run: pnpm test:integration

      - name: Build
        run: pnpm build
