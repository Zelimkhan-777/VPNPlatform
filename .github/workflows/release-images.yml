name: Release application images

on:
  workflow_dispatch:
  push:
    tags:
      - 'platform-v*'

permissions:
  contents: read
  packages: write

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/platform-v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WEB_API_PROXY_TARGET: http://api:3001
      CONTAINER_RELEASE_TAG: ${{ github.sha }}
      CONTAINER_REPOSITORY_PREFIX: ghcr.io/${{ github.repository_owner }}/vpnplatform
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Verify clean release source
        run: |
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Build application images
        run: pnpm infra:images:build

      - name: Smoke-test application images
        run: pnpm infra:images:smoke

      - name: Publish immutable application images
        run: pnpm infra:images:publish

      - name: Upload immutable image references
        uses: actions/upload-artifact@v4
        with:
          name: platform-release-images-${{ github.sha }}
          path: |
            var/container-images/release-manifest.json
            var/container-images/release-images.env
          if-no-files-found: error
          retention-days: 30
